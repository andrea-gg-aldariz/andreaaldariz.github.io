        * {

        nav a {

        }

        .hero {
            max-width: 1100px;

        }

           PHOTO

            transition: all 0.2s ease;
        }

        .button:hover {
            background: #405e50;
            color: white;
        }

           SECTIONS
        ========================= */

        section {
            padding: 80px 8%;
        }

        .section-inner {
            max-width: 1000px;
            margin: auto;
        }

        section:nth-child(even) {
            background: #f0f3ef;
        }

        .section-title {
            color: #28483d;
            font-family: Aptos, "Aptos Display", Arial, sans-serif;

            font-weight: 600;
            margin-bottom: 35px;

            height: 2px;

            margin-top: 12px;
        }

            gap: 25px;
        }

        .research-card {
            background: #faf9f6;
            border: 1px solid #d9ded9;
            padding: 30px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .research-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(40, 72, 61, 0.08);
        }

        .research-card h3 {
            color: #405e50;
            font-family: Aptos, "Aptos Display", Arial, sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .research-card p {
            color: #596861;
        }

        .publication {

        }

            color: #687b72;
        }


        /* =========================
           PROJECTS
        ========================= */

        .project {
            margin-bottom: 35px;
        }

        .project h3 {
            color: #405e50;
            font-family: Aptos, "Aptos Display", Arial, sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .project p {
            color: #465750;
        }


        /* =========================
           CONTACT
        ========================= */

        .contact {
            text-align: center;
        }

        .contact p {
            margin-bottom: 10px;
        }

        .contact a {
            color: #405e50;
            text-decoration: none;
            border-bottom: 1px solid #789b89;
            transition: color 0.2s ease;
        }

        .contact a:hover {
            color: #789b89;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            background: #28483d;
            color: #e8eee9;
            font-family: Aptos, "Aptos Display", Arial, sans-serif;
            font-size: 0.8rem;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                padding-top: 60px;
            }

            .hero p {
                margin: auto;
            }

            .links {
                justify-content: center;
            }

            .research-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 2.6rem;
            }

            .hero h2 {
                font-size: 1rem;
            }

            .photo-placeholder {
                width: 240px;
                height: 300px;
            }
        }

    </style>
</head>
